<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>AscendForge · 昇腾工坊</title>
  <link rel="icon" type="image/png" href="/static/assets/ascendforge-mark.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar" hidden>
      <a class="brand" href="#/dashboard" aria-label="AscendForge">
        <img class="brand-lockup" src="/static/assets/ascendforge-logo.png" alt="AscendForge">
      </a>
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-nav="dashboard">任务</a>
        <a href="#/settings" data-nav="connections">连接与设置</a>
      </nav>
      <div class="topbar-right">
        <span class="worker-pill" id="worker-pill" title="后台 worker 状态">worker ?</span>
        <button class="btn btn-ghost btn-sm" id="server-btn" type="button" title="远程服务器连接">服务器 <span id="server-pill" class="server-pill">未连接</span></button>
        <span class="user" id="current-user"></span>
        <button class="btn btn-ghost btn-sm" id="logout-btn" type="button">退出</button>
      </div>
    </header>
    <main id="view" class="view"></main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
